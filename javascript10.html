<html>
<head>
<title>mouse over event</title>
</head>
<body>
<h2>JAVASCRIPT Mouse Event Handling</h2>
<div onmouseover="changeContent()"onmouseout="restoreContent()">
<img id="img"src="image.jpeg"width"200"height="150">
<h3 id="mytext">Welcome to my page</h3>
</div>
<script>
    function changeContent(){
       document.getElementByld("img").src="javascript.jpeg";
       document.getElementByld("mytext").innerHTML="hello! welcome to javascript!";
       }
    function restoreContent(){
       document.getElementByld("img").src="bird.jpeg";
       document.getElementByld("mytext").innerHTML="welcome to my page";
       }
    </script>
    </body>
    </html>
